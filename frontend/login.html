<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login | SIAKAD SD Rawa Gempol</title>

    <link rel="stylesheet" href="./assets/css/main.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>

  <body class="login-page">
    <main class="login-shell">
      <section class="login-card">
        <div class="login-brand">
          <div class="login-brand-icon">
            <i class="bi bi-mortarboard-fill"></i>
          </div>

          <div>
            <h1>SIAKAD SDN Rawa Gempol</h1>
            <p>Masuk ke akun Anda</p>
          </div>
        </div>

        <form class="login-form" id="loginForm">
          <div class="form-group">
            <label for="roleSelect">Masuk sebagai</label>
            <select id="roleSelect">
              <option value="admin">Admin</option>
              <option value="wali_kelas">Wali Kelas</option>
            </select>
          </div>

          <div class="form-group">
            <label for="username">Username</label>
            <input
              id="username"
              type="text"
              autocomplete="username"
              placeholder="Masukkan username"
            />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              id="password"
              type="password"
              autocomplete="current-password"
              placeholder="Masukkan password"
            />
          </div>

          <button class="login-submit-btn" type="submit">
            <i class="bi bi-box-arrow-in-right"></i>
            Login
          </button>
        </form>
      </section>
    </main>

    <script type="module" src="./assets/js/pages/login.js"></script>
  </body>
</html>
